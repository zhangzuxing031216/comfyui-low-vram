<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .sub { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 15px; fill: #6b7280; }
      .ui { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 14px; fill: #374151; }
      .node { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 13px; fill: #111827; }
      .nhead { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .num { font-family: Arial,sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f1f5f9"/>
  <text x="60" y="52" class="title">ComfyUI 界面地图（示意图，非截图）</text>
  <text x="60" y="78" class="sub">先认识 6 个节点，其他都可以先忽略。</text>

  <!-- browser window -->
  <rect x="60" y="105" width="1080" height="560" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="60" y="105" width="1080" height="38" rx="12" fill="#e2e8f0"/>
  <circle cx="84" cy="124" r="6" fill="#ef4444"/>
  <circle cx="104" cy="124" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="124" r="6" fill="#22c55e"/>
  <rect x="150" y="114" width="420" height="20" rx="10" fill="#f8fafc"/>
  <text x="164" y="129" class="ui" fill="#64748b">http://127.0.0.1:8188</text>

  <!-- top menu -->
  <rect x="60" y="143" width="1080" height="34" fill="#0f172a"/>
  <text x="80" y="165" class="ui" fill="#e5e7eb">Workflow</text>
  <text x="160" y="165" class="ui" fill="#94a3b8">Edit</text>
  <text x="210" y="165" class="ui" fill="#94a3b8">View</text>
  <text x="260" y="165" class="ui" fill="#94a3b8">Queue</text>
  <text x="320" y="165" class="ui" fill="#94a3b8">Help</text>

  <!-- left toolbar -->
  <rect x="60" y="177" width="54" height="488" fill="#111827"/>
  <g fill="#64748b">
    <rect x="72" y="200" width="30" height="30" rx="6"/>
    <rect x="72" y="244" width="30" height="30" rx="6"/>
    <rect x="72" y="288" width="30" height="30" rx="6"/>
    <rect x="72" y="332" width="30" height="30" rx="6"/>
    <rect x="72" y="376" width="30" height="30" rx="6"/>
  </g>
  <text x="87" y="220" text-anchor="middle" class="ui" fill="#ffffff">+</text>

  <!-- canvas -->
  <rect x="114" y="177" width="780" height="488" fill="#1e293b"/>
  <!-- nodes -->
  <g>
    <rect x="150" y="220" width="190" height="86" rx="8" fill="#ffffff"/>
    <rect x="150" y="220" width="190" height="26" rx="8" fill="#2563eb"/>
    <text x="164" y="238" class="nhead">Load Checkpoint</text>
    <text x="164" y="264" class="node">majicmix_v7.safetensors</text>
    <text x="164" y="286" class="node" fill="#6b7280">MODEL / CLIP / VAE</text>

    <rect x="150" y="340" width="190" height="74" rx="8" fill="#ffffff"/>
    <rect x="150" y="340" width="190" height="26" rx="8" fill="#0891b2"/>
    <text x="164" y="358" class="nhead">Empty Latent Image</text>
    <text x="164" y="384" class="node">512 × 512 × 1</text>

    <rect x="410" y="220" width="190" height="86" rx="8" fill="#ffffff"/>
    <rect x="410" y="220" width="190" height="26" rx="8" fill="#7c3aed"/>
    <text x="424" y="238" class="nhead">CLIP Text Encode +</text>
    <text x="424" y="264" class="node">masterpiece, 1girl...</text>

    <rect x="410" y="340" width="190" height="86" rx="8" fill="#ffffff"/>
    <rect x="410" y="340" width="190" height="26" rx="8" fill="#db2777"/>
    <text x="424" y="358" class="nhead">CLIP Text Encode -</text>
    <text x="424" y="384" class="node">lowres, bad hands...</text>

    <rect x="650" y="220" width="190" height="120" rx="8" fill="#ffffff"/>
    <rect x="650" y="220" width="190" height="26" rx="8" fill="#ea580c"/>
    <text x="664" y="238" class="nhead">KSampler</text>
    <text x="664" y="264" class="node">steps 20 / cfg 7</text>
    <text x="664" y="286" class="node">euler / normal</text>
    <text x="664" y="308" class="node">seed 随机</text>

    <rect x="650" y="380" width="190" height="74" rx="8" fill="#ffffff"/>
    <rect x="650" y="380" width="190" height="26" rx="8" fill="#16a34a"/>
    <text x="664" y="398" class="nhead">VAE Decode</text>
    <text x="664" y="424" class="node">LATENT → IMAGE</text>

    <rect x="650" y="490" width="190" height="74" rx="8" fill="#ffffff"/>
    <rect x="650" y="490" width="190" height="26" rx="8" fill="#475569"/>
    <text x="664" y="508" class="nhead">Save Image</text>
    <text x="664" y="534" class="node">output\*.png</text>
  </g>
  <!-- links -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M340 248 C380 248, 380 270, 410 270"/>
    <path d="M340 268 C380 268, 380 380, 410 380"/>
    <path d="M340 290 C600 290, 600 270, 650 270"/>
    <path d="M600 260 C630 260, 630 250, 650 250"/>
    <path d="M600 380 C630 380, 630 300, 650 300"/>
    <path d="M340 400 C500 400, 500 300, 650 300"/>
    <path d="M840 280 C880 280, 880 410, 840 410"/>
    <path d="M840 454 C870 454, 870 520, 840 520"/>
  </g>

  <!-- right queue -->
  <rect x="894" y="177" width="246" height="488" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="914" y="208" class="ui" font-weight="700">Queue</text>
  <rect x="914" y="226" width="206" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="928" y="250" class="ui">running</text>
  <text x="928" y="270" class="ui" fill="#64748b">0 / 1</text>
  <rect x="914" y="292" width="206" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="928" y="316" class="ui">pending</text>
  <text x="928" y="336" class="ui" fill="#64748b">empty</text>
  <rect x="914" y="366" width="206" height="120" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="928" y="390" class="ui" fill="#64748b">history</text>

  <!-- callouts -->
  <g>
    <circle cx="90" cy="200" r="13" fill="#dc2626"/>
    <text x="90" y="205" text-anchor="middle" class="num">1</text>
    <circle cx="170" cy="205" r="13" fill="#dc2626"/>
    <text x="170" y="210" text-anchor="middle" class="num">2</text>
    <circle cx="430" cy="205" r="13" fill="#dc2626"/>
    <text x="430" y="210" text-anchor="middle" class="num">3</text>
    <circle cx="670" cy="205" r="13" fill="#dc2626"/>
    <text x="670" y="210" text-anchor="middle" class="num">4</text>
    <circle cx="670" cy="365" r="13" fill="#dc2626"/>
    <text x="670" y="370" text-anchor="middle" class="num">5</text>
    <circle cx="1080" cy="200" r="13" fill="#dc2626"/>
    <text x="1080" y="205" text-anchor="middle" class="num">6</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="60" y="690" width="1080" height="20" fill="none"/>
    <text x="60" y="704" class="ui" fill="#475569">① 工具栏（节点库）　② Load Checkpoint（选底模）　③ 正面提示词　④ KSampler（步数/CFG/采样器）　⑤ VAE Decode（潜空间→图片）　⑥ Queue（提交/看进度）</text>
  </g>
</svg>