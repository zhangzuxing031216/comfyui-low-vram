<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="Low VRAM comparison and measured speed">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .card { fill: #111827; stroke: #1f2937; stroke-width: 1; }
      .card-hi { fill: #111827; stroke: #38bdf8; stroke-width: 1.6; }
      .title { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 18px; font-weight: 700; }
      .h2 { fill: #e2e8f0; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 13px; font-weight: 700; }
      .t { fill: #cbd5e1; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 11px; }
      .s { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .tiny { fill: #64748b; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 9px; }
      .num { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; font-weight: 700; }
      .bar { fill: #38bdf8; }
      .bar2 { fill: #a78bfa; }
      .bar3 { fill: #34d399; }
      .bar4 { fill: #f59e0b; }
      .grid { stroke: #1e293b; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="640"/>

  <text x="36" y="44" class="title">低显存能跑什么？先看这张图</text>
  <text x="36" y="66" class="s">数据来自 RTX 3060 Laptop 6GB 实测；4GB / 8GB 为推荐配置，未在本机实测。</text>

  <!-- speed chart -->
  <rect x="36" y="88" width="540" height="286" class="card" rx="10"/>
  <text x="56" y="116" class="h2">6GB 实测速度（SD1.5）</text>
  <text x="56" y="136" class="s">数值越小越好 · 同一台机器、同一模型</text>

  <!-- grid lines -->
  <line x1="190" y1="160" x2="550" y2="160" class="grid"/>
  <line x1="190" y1="205" x2="550" y2="205" class="grid"/>
  <line x1="190" y1="250" x2="550" y2="250" class="grid"/>
  <line x1="190" y1="295" x2="550" y2="295" class="grid"/>
  <line x1="190" y1="340" x2="550" y2="340" class="grid"/>
  <text x="190" y="356" class="tiny">0s</text>
  <text x="310" y="356" class="tiny">5s</text>
  <text x="430" y="356" class="tiny">10s</text>
  <text x="540" y="356" class="tiny">15s</text>

  <text x="56" y="180" class="t">首次出图</text>
  <rect x="190" y="168" width="331" height="18" rx="4" class="bar4"/>
  <text x="530" y="181" class="num">14.0s</text>

  <text x="56" y="225" class="t">512×512 / 20 步</text>
  <rect x="190" y="213" width="135" height="18" rx="4" class="bar"/>
  <text x="334" y="226" class="num">5.7s</text>

  <text x="56" y="270" class="t">512×512 / 30 步</text>
  <rect x="190" y="258" width="213" height="18" rx="4" class="bar2"/>
  <text x="412" y="271" class="num">9.0s</text>

  <text x="56" y="315" class="t">768×768 / 20 步</text>
  <rect x="190" y="303" width="357" height="18" rx="4" class="bar3"/>
  <text x="530" y="316" class="num">15.1s</text>

  <!-- cards -->
  <rect x="596" y="88" width="468" height="86" class="card-hi" rx="10"/>
  <text x="616" y="116" class="h2">6GB · 本机实测</text>
  <text x="616" y="138" class="t">SD1.5 很顺；SDXL 768 可跑；1024 需 Tiled VAE。</text>
  <text x="616" y="158" class="s">启动参数：--lowvram · 推荐 start-lowvram.bat</text>

  <rect x="596" y="186" width="468" height="86" class="card" rx="10"/>
  <text x="616" y="214" class="h2">4GB · 极简档</text>
  <text x="616" y="236" class="t">只做 512×512、LCM 4 步、轻量 ControlNet。</text>
  <text x="616" y="256" class="s">启动参数：--novram · 推荐 start-4gb.bat</text>

  <rect x="596" y="284" width="468" height="86" class="card" rx="10"/>
  <text x="616" y="312" class="h2">8GB · 舒适档</text>
  <text x="616" y="334" class="t">SDXL 1024 比较稳；可批量；短视频更从容。</text>
  <text x="616" y="354" class="s">启动参数：--lowvram · 可试 1024 + Tiled VAE</text>

  <!-- capability matrix -->
  <rect x="36" y="398" width="1028" height="200" class="card" rx="10"/>
  <text x="56" y="426" class="h2">能力边界速查</text>
  <line x1="56" y1="442" x2="1044" y2="442" class="grid"/>
  <text x="56" y="464" class="s">任务</text>
  <text x="300" y="464" class="s">4GB</text>
  <text x="470" y="464" class="s">6GB</text>
  <text x="640" y="464" class="s">8GB</text>
  <text x="810" y="464" class="s">12GB+</text>

  <text x="56" y="494" class="t">SD1.5 512×512</text>
  <text x="300" y="494" class="t" fill="#34d399">可以</text>
  <text x="470" y="494" class="t" fill="#34d399">很顺</text>
  <text x="640" y="494" class="t" fill="#34d399">很顺</text>
  <text x="810" y="494" class="t" fill="#34d399">批量</text>

  <text x="56" y="524" class="t">SDXL 768×768</text>
  <text x="300" y="524" class="t" fill="#f87171">不建议</text>
  <text x="470" y="524" class="t" fill="#fbbf24">可跑</text>
  <text x="640" y="524" class="t" fill="#34d399">稳</text>
  <text x="810" y="524" class="t" fill="#34d399">稳</text>

  <text x="56" y="554" class="t">SDXL 1024×1024</text>
  <text x="300" y="554" class="t" fill="#f87171">不行</text>
  <text x="470" y="554" class="t" fill="#fbbf24">Tiled VAE，慢</text>
  <text x="640" y="554" class="t" fill="#34d399">比较稳</text>
  <text x="810" y="554" class="t" fill="#34d399">稳</text>

  <text x="56" y="584" class="t">短视频 / AnimateDiff</text>
  <text x="300" y="584" class="t" fill="#f87171">很难</text>
  <text x="470" y="584" class="t" fill="#fbbf24">低分辨率片段</text>
  <text x="640" y="584" class="t" fill="#fbbf24">可尝试</text>
  <text x="810" y="584" class="t" fill="#34d399">较从容</text>

  <text x="36" y="626" class="tiny" fill="#f59e0b">示意与实测混合说明：速度只代表本机 6GB；能力判断随模型、分辨率、步数、系统占用变化。</text>
</svg>