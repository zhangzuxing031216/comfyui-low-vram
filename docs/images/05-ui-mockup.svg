<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="ComfyUI low VRAM workflow mockup">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="0.72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #111827; stroke: #1f2937; stroke-width: 1; }
      .panel2 { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .node { fill: #1e293b; stroke: #475569; stroke-width: 1.2; rx: 8; }
      .node-hi { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.6; rx: 8; }
      .title { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 13px; font-weight: 700; }
      .t { fill: #cbd5e1; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 11px; }
      .s { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 10px; }
      .tiny { fill: #64748b; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 9px; }
      .port { fill: #38bdf8; }
      .wire { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .wire2 { stroke: #a78bfa; stroke-width: 1.6; fill: none; }
      .tag { fill: #0ea5e9; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#0f172a"/>
  <circle cx="24" cy="21" r="7" fill="#38bdf8"/>
  <text x="40" y="26" class="title">ComfyUI</text>
  <text x="120" y="26" class="s">Workflow · sd15-basic.json</text>
  <rect x="330" y="11" width="70" height="22" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="345" y="26" class="s">Queue</text>
  <rect x="410" y="11" width="70" height="22" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="425" y="26" class="s">Clear</text>
  <rect x="490" y="11" width="90" height="22" rx="5" fill="#0ea5e9"/>
  <text x="510" y="26" class="s" fill="#04121f" font-weight="700">Queue Prompt</text>
  <text x="1110" y="26" class="s">6GB · --lowvram</text>

  <!-- left panel -->
  <rect x="12" y="54" width="170" height="686" class="panel" rx="8"/>
  <text x="26" y="78" class="title">Queue</text>
  <text x="26" y="96" class="s">0 running · 1 done</text>
  <rect x="22" y="110" width="150" height="54" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="32" y="130" class="t">#1 512×512</text>
  <text x="32" y="148" class="s">Euler · 20 steps · 5.7s</text>

  <text x="26" y="195" class="title">Workflows</text>
  <text x="26" y="215" class="s">▸ sd15-basic.json</text>
  <text x="26" y="235" class="s">▸ sdxl-768-lowvram.json</text>
  <text x="26" y="255" class="s">▸ upscale-4x.json</text>

  <text x="26" y="300" class="title">Model</text>
  <rect x="22" y="312" width="150" height="26" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="32" y="329" class="s">majicmixRealistic_v7</text>
  <text x="26" y="360" class="s">VAE · vae-ft-mse-840000</text>
  <text x="26" y="380" class="s">LoRA · LCM (optional)</text>

  <text x="26" y="425" class="title">VRAM advice</text>
  <text x="26" y="445" class="s">512 first</text>
  <text x="26" y="463" class="s">then 768</text>
  <text x="26" y="481" class="s">1024 only with tiled VAE</text>

  <!-- canvas -->
  <rect x="194" y="54" width="716" height="620" class="panel2" rx="8"/>
  <text x="208" y="76" class="s">Canvas · drag nodes · connect ports</text>

  <!-- wires behind nodes -->
  <path class="wire" d="M 390 170 C 420 170, 420 165, 448 165"/>
  <path class="wire" d="M 390 190 C 420 190, 420 275, 448 275"/>
  <path class="wire" d="M 390 210 C 420 210, 420 390, 448 390"/>
  <path class="wire" d="M 660 165 C 690 165, 690 250, 708 250"/>
  <path class="wire" d="M 660 275 C 690 275, 690 285, 708 285"/>
  <path class="wire" d="M 660 390 C 690 390, 690 320, 708 320"/>
  <path class="wire2" d="M 892 300 C 930 300, 930 540, 500 540 L 500 515"/>
  <path class="wire" d="M 690 510 L 704 510"/>

  <!-- Load checkpoint -->
  <rect x="210" y="125" width="180" height="100" class="node-hi"/>
  <text x="224" y="147" class="title">Load Checkpoint</text>
  <text x="224" y="166" class="s">majicmixRealistic_v7</text>
  <text x="224" y="184" class="s">vae-ft-mse-840000</text>
  <circle cx="390" cy="165" r="4" class="port"/>
  <circle cx="390" cy="190" r="4" class="port"/>
  <circle cx="390" cy="210" r="4" fill="#a78bfa"/>

  <!-- positive prompt -->
  <rect x="448" y="120" width="212" height="90" class="node"/>
  <text x="462" y="142" class="title">CLIP Text Encode</text>
  <text x="462" y="160" class="s">positive</text>
  <text x="462" y="178" class="t">masterpiece, best quality,</text>
  <text x="462" y="194" class="t">portrait, soft light</text>
  <circle cx="448" cy="165" r="4" fill="#a78bfa"/>
  <circle cx="660" cy="165" r="4" class="port"/>

  <!-- negative prompt -->
  <rect x="448" y="230" width="212" height="90" class="node"/>
  <text x="462" y="252" class="title">CLIP Text Encode</text>
  <text x="462" y="270" class="s">negative</text>
  <text x="462" y="288" class="t">low quality, blurry, bad hands,</text>
  <text x="462" y="304" class="t">watermark, text</text>
  <circle cx="448" cy="275" r="4" fill="#a78bfa"/>
  <circle cx="660" cy="275" r="4" class="port"/>

  <!-- latent -->
  <rect x="448" y="350" width="212" height="80" class="node"/>
  <text x="462" y="372" class="title">Empty Latent Image</text>
  <text x="462" y="390" class="s">512 × 512 · batch 1</text>
  <text x="462" y="408" class="s">seed 42</text>
  <circle cx="660" cy="390" r="4" class="port"/>

  <!-- KSampler -->
  <rect x="708" y="190" width="184" height="160" class="node-hi"/>
  <text x="722" y="212" class="title">KSampler</text>
  <text x="722" y="231" class="s">steps 20 · cfg 7.0</text>
  <text x="722" y="249" class="s">sampler euler</text>
  <text x="722" y="267" class="s">scheduler normal</text>
  <text x="722" y="285" class="s">denoise 1.00</text>
  <text x="722" y="303" class="s">seed 42</text>
  <circle cx="708" cy="250" r="4" fill="#a78bfa"/>
  <circle cx="708" cy="285" r="4" class="port"/>
  <circle cx="708" cy="320" r="4" fill="#34d399"/>
  <circle cx="892" cy="300" r="4" class="port"/>

  <!-- VAE decode -->
  <rect x="500" y="480" width="190" height="80" class="node"/>
  <text x="514" y="502" class="title">VAE Decode</text>
  <text x="514" y="520" class="s">latent → image</text>
  <circle cx="500" cy="510" r="4" class="port"/>
  <circle cx="690" cy="510" r="4" fill="#f59e0b"/>

  <!-- Save -->
  <rect x="708" y="480" width="184" height="80" class="node"/>
  <text x="722" y="502" class="title">Save Image</text>
  <text x="722" y="520" class="s">output/ComfyUI_0001_.png</text>
  <circle cx="708" cy="510" r="4" fill="#f59e0b"/>

  <!-- right preview -->
  <rect x="924" y="54" width="264" height="620" class="panel" rx="8"/>
  <text x="940" y="78" class="title">Preview</text>
  <rect x="940" y="92" width="232" height="270" rx="8" fill="#0f172a" stroke="#334155"/>
  <!-- abstract placeholder art -->
  <rect x="948" y="100" width="216" height="254" rx="6" fill="url(#art)"/>
  <circle cx="1060" cy="180" r="40" fill="#fef3c7" opacity="0.75"/>
  <path d="M 948 300 L 1020 220 L 1080 270 L 1120 235 L 1164 300 L 1164 354 L 948 354 Z" fill="#0f172a" opacity="0.55"/>
  <path d="M 948 330 L 1010 285 L 1070 320 L 1120 290 L 1164 330 L 1164 354 L 948 354 Z" fill="#020617" opacity="0.75"/>
  <text x="956" y="342" class="tiny" fill="#e2e8f0">placeholder preview · not a real render</text>

  <text x="940" y="390" class="title">Image info</text>
  <text x="940" y="410" class="s">512 × 512 · PNG</text>
  <text x="940" y="428" class="s">seed 42 · steps 20</text>
  <text x="940" y="446" class="s">5.7s on RTX 3060 6GB</text>
  <text x="940" y="464" class="s">model majicMIX v7</text>

  <text x="940" y="500" class="title">Tips</text>
  <text x="940" y="520" class="s">First run: ~14s (model load)</text>
  <text x="940" y="538" class="s">Repeat same image: cache, not real</text>
  <text x="940" y="556" class="s">768: ~15s · 1024: tiled VAE</text>

  <rect x="940" y="590" width="232" height="58" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="952" y="610" class="s" fill="#fbbf24">Note</text>
  <text x="952" y="628" class="s">This is a layout mockup.</text>
  <text x="952" y="643" class="s">Not a screenshot of a real render.</text>

  <!-- bottom status -->
  <rect x="194" y="684" width="716" height="46" class="panel" rx="8"/>
  <text x="208" y="704" class="s">Prompt executed in 5.7 seconds</text>
  <text x="208" y="720" class="tiny">VRAM 5.1/6.0 GB · RAM 9.2/16 GB · queue 0</text>
  <rect x="700" y="697" width="190" height="20" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="712" y="712" class="tiny">output/ComfyUI_0001_.png</text>

  <text x="12" y="748" class="tiny" fill="#f59e0b">示意图（mockup）：用于说明界面布局和节点关系，不是真实截图，也不是真实出图。</text>
</svg>