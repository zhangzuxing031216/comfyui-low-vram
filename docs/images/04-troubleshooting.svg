<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .sub { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 15px; fill: #6b7280; }
      .box { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 15px; fill: #111827; }
      .small { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 13px; fill: #4b5563; }
      .lbl { font-family: "Microsoft YaHei","Noto Sans CJK SC",sans-serif; font-size: 12px; fill: #6b7280; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="58" class="title">出问题了？按这个顺序查</text>
  <text x="60" y="86" class="sub">先判断“卡在哪一层”，不要一上来就重装。</text>

  <!-- root -->
  <rect x="470" y="115" width="260" height="64" rx="12" fill="#0f172a"/>
  <text x="600" y="143" text-anchor="middle" class="box" fill="#ffffff" font-weight="700">哪里出问题？</text>
  <text x="600" y="165" text-anchor="middle" class="small" fill="#94a3b8">先看控制台最后 20 行</text>

  <!-- level 1 -->
  <g>
    <rect x="70" y="230" width="240" height="70" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="190" y="258" text-anchor="middle" class="box" font-weight="700">打不开网页</text>
    <text x="190" y="282" text-anchor="middle" class="small">服务没起来 / 端口占用</text>

    <rect x="350" y="230" width="240" height="70" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="470" y="258" text-anchor="middle" class="box" font-weight="700">没有模型</text>
    <text x="470" y="282" text-anchor="middle" class="small">放错目录 / 没刷新</text>

    <rect x="630" y="230" width="240" height="70" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="750" y="258" text-anchor="middle" class="box" font-weight="700">出图 OOM</text>
    <text x="750" y="282" text-anchor="middle" class="small">显存不够 / 分辨率太高</text>

    <rect x="910" y="230" width="230" height="70" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="1025" y="258" text-anchor="middle" class="box" font-weight="700">图不对</text>
    <text x="1025" y="282" text-anchor="middle" class="small">黑图 / 花屏 / 糊</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M520 179 C400 179, 190 200, 190 230" marker-end="url(#a)"/>
    <path d="M560 179 C520 179, 470 200, 470 230" marker-end="url(#a)"/>
    <path d="M640 179 C680 179, 750 200, 750 230" marker-end="url(#a)"/>
    <path d="M690 179 C850 179, 1025 200, 1025 230" marker-end="url(#a)"/>
  </g>

  <!-- detail cards -->
  <g>
    <rect x="70" y="340" width="240" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="88" y="370" class="small" font-weight="700" fill="#991b1b">1. 看控制台</text>
    <text x="88" y="398" class="small">有 "To see the GUI"？</text>
    <text x="88" y="424" class="small">没有 → 服务没起来</text>
    <text x="88" y="456" class="small">2. 端口占用？</text>
    <text x="88" y="482" class="small">换 --port 8189</text>
    <text x="88" y="514" class="small">3. bat 一闪而过？</text>
    <text x="88" y="540" class="small">在 PowerShell 里手动跑</text>
    <text x="88" y="572" class="small">4. 防火墙？</text>
    <text x="88" y="598" class="small">允许 Python 专用网络</text>
  </g>

  <g>
    <rect x="350" y="340" width="240" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="368" y="370" class="small" font-weight="700" fill="#92400e">1. 文件在不在</text>
    <text x="368" y="398" class="small">models\checkpoints</text>
    <text x="368" y="424" class="small">2. 扩展名对不对</text>
    <text x="368" y="450" class="small">.safetensors / .ckpt</text>
    <text x="368" y="482" class="small">3. 是不是 .part</text>
    <text x="368" y="508" class="small">4. 按 R 刷新</text>
    <text x="368" y="540" class="small">5. 重启</text>
    <text x="368" y="572" class="small">6. extra_model_paths</text>
  </g>

  <g>
    <rect x="630" y="340" width="240" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="648" y="370" class="small" font-weight="700" fill="#1e40af">按顺序降级</text>
    <text x="648" y="398" class="small">1. 1024 → 768 → 512</text>
    <text x="648" y="424" class="small">2. batch → 1</text>
    <text x="648" y="450" class="small">3. Tiled VAE (512/256)</text>
    <text x="648" y="476" class="small">4. SDXL → SD1.5</text>
    <text x="648" y="502" class="small">5. --lowvram</text>
    <text x="648" y="528" class="small">6. --novram</text>
    <text x="648" y="554" class="small">7. 关后台 / 加虚拟内存</text>
  </g>

  <g>
    <rect x="910" y="340" width="230" height="330" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="928" y="370" class="small" font-weight="700" fill="#166534">对症下药</text>
    <text x="928" y="398" class="small">全黑 → 换 VAE</text>
    <text x="928" y="424" class="small">花屏 → 重下模型</text>
    <text x="928" y="450" class="small">糊 → 步数/放大</text>
    <text x="928" y="476" class="small">灰 → 换 VAE</text>
    <text x="928" y="502" class="small">手崩 → 负面词/修手</text>
    <text x="928" y="528" class="small">双头 → 降分辨率</text>
    <text x="928" y="554" class="small">慢 → 换 SD1.5</text>
  </g>

  <!-- bottom rule -->
  <rect x="70" y="700" width="1070" height="42" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="90" y="727" class="small" fill="#065f46">铁律：一次只改一个变量；改完立刻重跑；把报错最后 20 行留下来。不要一次改五个地方。</text>
</svg>